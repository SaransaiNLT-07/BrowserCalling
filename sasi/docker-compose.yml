services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: Saran
      POSTGRES_USER: Saran
      POSTGRES_PASSWORD: Saran
    ports:
      - "5432:5432"
    volumes:
      - Saran-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,api
    depends_on:
      - postgres
      - redis
    ports:
      - "8741:8741"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  Saran-postgres:
